# lore, as a folder in $HOME with a compose file — the existing convention on the
# deployment host.
#
#   docker compose up -d
#   docker compose exec lore node /app/src/index.ts new --name vany --git git@github.com:org/repo.git
#
# Reachable only over Tailscale (D-33), so there is no public TLS and no domain.
# Bearer tokens remain, for per-repo scoping rather than perimeter.

services:
  lore:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Pinned so the arm64 assumption is explicit rather than inherited from the
    # builder's architecture.
    platform: linux/arm64
    restart: unless-stopped
    # Bind to the tailnet address, not 0.0.0.0, so the service is never exposed on
    # a LAN interface by accident. Replace with this host's tailscale IP.
    ports:
      - "100.64.0.1:7777:7777"
    environment:
      LORE_DATA_DIR: /var/lib/lore
      LORE_PORT: "7777"
      LORE_CONCURRENCY: "2"          # T0 is CPU-bound on an SBC; set by cores (D-37)
      LORE_DAILY_CEILING_USD: "100"  # stops STARTING reviews when hit, never mid-review
      LORE_RUN_TESTS: "0"            # opt-in: executes arbitrary project code (D-24)
      LORE_WEBHOOK_URL: ${LORE_WEBHOOK_URL:-}
      LORE_HEARTBEAT_URL: ${LORE_HEARTBEAT_URL:-}
      OPENCODE_SERVER: http://opencode:4096
      # The same credentials the opencode service is started with. opencode answers
      # a bare 401 with no hint when these are missing, which cost real time to
      # diagnose the first time.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-lore}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      # A HOST BIND, NOT A NAMED VOLUME, and the path is identical on both sides.
      #
      # The T0 sandbox asks the host daemon to bind-mount a worktree into a sibling
      # container by absolute path. The daemon resolves that path on the HOST — so
      # with a named volume it would mount an empty directory and the tests would
      # run against nothing, reporting a clean suite for code it never saw. Same
      # path everywhere is the only arrangement where "the path I have" and "the
      # path the daemon sees" are the same string.
      - ${LORE_HOST_DATA:-/var/lib/lore}:/var/lib/lore
      # The T0 sandbox launches SIBLING containers for test execution, so untrusted
      # project code never runs in this container — which holds every repo's deploy
      # key and the knowledge database (D-24).
      #
      # This grants root-equivalent control of the host daemon. Acceptable only
      # because this box does one job on a private tailnet; it is the single
      # largest privilege in this file and should be revisited if that changes.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - opencode

  # Model transport. Reviewers inherit this configuration, which is how they get
  # the same MCP servers and plugins a Claude Code session has (D-12).
  opencode:
    build:
      context: ..
      dockerfile: deploy/opencode.Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    environment:
      # Verified: opencode reads this from the environment, with no auth.json. The
      # staged auth.json below also carries it; either alone is enough.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      # The plane MCP config references these by name rather than embedding the
      # key, so the config file is safe to copy and the secret stays in .env.
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      # Basic auth on the server. lore reads the same two variables, which is how a
      # protected server needs no extra configuration on either side.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-lore}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      # THE REPOSITORIES, READ-ONLY, AT THE SAME PATH AS IN `lore`.
      #
      # Two things depend on this and both are easy to get wrong:
      #
      # 1. lore hands opencode an ABSOLUTE worktree path. Without this mount the
      #    directory simply does not exist over here and every review fails; with a
      #    different mount point it silently reviews nothing.
      #
      # 2. `:ro` enforces INV-9 at the filesystem. Reviewers are denied write tools
      #    in the request body already, but that is a policy the model could in
      #    principle route around. A read-only bind is not a policy.
      - ${LORE_HOST_DATA:-/var/lib/lore}:/var/lib/lore:ro
      # This machine's opencode configuration, staged by `make sync-opencode`:
      # the plane MCP server, the plugins and the read-only agent, so reviewers
      # inherit what a Claude Code session has (D-12).
      #
      # The staging step STRIPS THE ANTHROPIC CREDENTIAL. Claude writes the code
      # under review, so with no Anthropic credential present, D-1 is enforced by
      # absence rather than by a tier config a typo could undo.
      - ./opencode/config:/home/lore/.config/opencode:ro
      - ./opencode/data:/home/lore/.local/share/opencode:ro

  # Continuous replication of the SQLite database.
  #
  # The knowledge base IS the product: losing it loses everything the workgroup
  # ever taught the service, and this device has no redundancy. The target must be
  # OFF this machine, and the restore must actually have been performed — an
  # untested backup is not a backup.
  litestream:
    image: litestream/litestream:latest
    platform: linux/arm64
    restart: unless-stopped
    command: ["replicate"]
    volumes:
      - ${LORE_HOST_DATA:-/var/lib/lore}:/var/lib/lore
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    depends_on:
      - lore
