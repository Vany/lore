# lore, as a folder in $HOME with a compose file — the existing convention on the
# deployment host.
#
#   docker compose up -d
#   docker compose exec lore node /app/src/index.ts new --name vany --git git@github.com:org/repo.git
#
# Reachable only over Tailscale (D-33), so there is no public TLS and no domain.
# Bearer tokens remain, for per-repo scoping rather than perimeter.

services:
  # The T0 test sandbox image. Built, never started: `lore` launches it per review
  # as a sibling container. Declared here so `make build` produces it.
  sandbox:
    build:
      context: ..
      dockerfile: deploy/sandbox.Dockerfile
    image: lore-sandbox:node24
    platform: linux/arm64
    profiles: ["build-only"]
    command: ["true"]

  lore:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # So `/status` can say WHICH code is running. `make up` passes the checkout's
        # real commit; a bare `docker compose build` leaves them "unknown", which is
        # the honest answer rather than a plausible wrong one.
        LORE_COMMIT: ${LORE_COMMIT:-unknown}
        LORE_BUILT_AT: ${LORE_BUILT_AT:-unknown}
    # Pinned so the arm64 assumption is explicit rather than inherited from the
    # builder's architecture.
    platform: linux/arm64
    restart: unless-stopped
    # Run as the HOST user who owns LORE_HOST_DATA.
    #
    # The data directory is a host bind, not a volume, because the T0 sandbox asks
    # the daemon to bind worktree paths into sibling containers and the daemon
    # resolves those on the host. A container uid that does not match the directory
    # owner cannot write the database — and the sandbox's siblings would inherit
    # the same mismatch.
    user: "${LORE_UID:-1000}:${LORE_GID:-1000}"
    # DEFAULTS TO LOOPBACK ON PURPOSE.
    #
    # The design assumed a tailnet, where WireGuard is the perimeter and the
    # bearer tokens only scope one teammate away from another's repo. The
    # deployment host has no tailscale, so on a LAN THE TOKENS ARE THE PERIMETER.
    # Set LORE_BIND to the address the workgroup reaches, deliberately.
    ports:
      - "${LORE_BIND:-127.0.0.1}:7777:7777"
    environment:
      # SAME PATH AS THE HOST, deliberately — see the volume below.
      LORE_DATA_DIR: ${LORE_HOST_DATA:-/var/lib/lore}
      # THE DATABASE LIVES SOMEWHERE ELSE, and this is the whole point of the split.
      #
      # Everything else under LORE_DATA_DIR must be a host bind (worktrees, see below).
      # SQLite must NOT be: a host bind on Docker Desktop for macOS is virtiofs, which
      # the container reports as `fakeowner` over /run/host_mark, and SQLite's own
      # howtocorrupt.html §2.1 names a filesystem with unreliable locking plus two or
      # more processes as a cause of corruption. lore and litestream are those two
      # processes, and this database was corrupted three times in three days — the
      # damaged tree each time being `knowledge`, which a review bulk-writes.
      #
      # A named volume is ext4 inside the Linux VM, so locking is ordinary kernel
      # locking. Nothing about the database needs to be visible from the host: the
      # thing a human carries away is the REPLICA, and that stays a host bind.
      LORE_DB_DIR: /var/lib/lore/db
      LORE_PORT: "7777"
      # How many ROUNDS run at once. Governs both halves of a round, which have very
      # different costs: the model call is remote and merely waits (t1 averages 304s,
      # t2 915s), while T0 runs a sandbox container locally and is CPU- and
      # memory-bound. Raising this buys real throughput on the waiting half and
      # oversubscribes the local one.
      #
      # 12 on a machine whose DOCKER VM has 7.7 GB, against a 6g limit per sandbox.
      # That is deliberate and the arithmetic is not a mistake: limits are ceilings,
      # not reservations, and a warm install uses a fraction of one — which is why 2
      # has been fine while already requesting 12 GB of limits. Workers are also
      # rarely in T0 together, since the model call dominates the round.
      #
      # When it is wrong it is wrong LOUDLY: an OOM-killed sandbox exits 137 and is
      # reported as `did not finish`, never as a clean check. Watch for that in
      # `checks_skipped`; if it appears, give Docker Desktop more memory (24 GB makes
      # four concurrent cold installs comfortable) rather than guessing here.
      # LORE_CONCURRENCY IS GONE (D-101). There is no worker pool: a claimed job starts its
      # round immediately, so nothing sits in `queued` waiting for a loop to free up, and
      # the only bound is admission — a new review is refused at 128 open.
      #
      # The service REFUSES TO START if it is still set, which is how this line was found:
      # I deleted the variable from the code, left it here, and the container crash-looped
      # with the service down. A guard that fails loud is only as good as the deployment
      # it was checked against.
      # LORE_MODEL_CONCURRENCY IS GONE (D-98). It capped model calls in flight and queued
      # the rest, which is real protection — twelve concurrent calls killed four reviews
      # in 2.5 minutes on 2026-08-05 — but what it produced day to day was a round sitting
      # in `queued` with a clock running and nothing able to say whether it was waiting or
      # wedged. A round now launches immediately, and the bound is admission: review_start
      # refuses at 128 open reviews. Concurrent calls are therefore bounded by
      # the machine itself: rounds start at once and the host is what bounds them.
      #
      # The service REFUSES TO START if this variable is still set, rather than ignoring
      # it: a setting that silently does nothing is decoration a reader believes.
      # MAY A FALLBACK WALK ONTO A ROUTE THAT BILLS PER CALL (D-117)?
      #
      # This replaced LORE_DAILY_CEILING_USD, and the two are not the same instrument.
      # The ceiling was a TOTAL: it noticed after the money was gone and then stopped the
      # gate for everybody, which on 2026-08-16 was eight reviews on three colleagues'
      # branches, at round 0, over a bill an unrelated batch had run up. This is asked per
      # call, before the call, from the route id — `openrouter/` is the only metered
      # provider here (D-121).
      #
      # "0" is this deployment's DEFAULT answer: every tier has a subscription route, and a
      # tier whose plan is out is honestly reported as skipped (`passed_partial`, named in
      # checks_skipped) rather than quietly bought at ~$4.83 a call. Set it to "1" in .env
      # to buy the coverage instead — that is a deliberate purchase, not a fallback.
      #
      # ${LORE_ALLOW_METERED:-0}, NOT A BARE "0" — found by lore's own review, fingerprint
      # 3297759e: this was hardcoded with no interpolation at all, so the comment two
      # lines up and config-view.ts's own operator-facing remedy ("Set it in the
      # deployment's .env and redeploy") were both describing a control that did not
      # exist — an operator who set LORE_ALLOW_METERED=1 in .env, believing either, got
      # no effect at all. The DEFAULT is unchanged for every deployment that has not
      # touched this: "0" either way.
      #
      # The service REFUSES TO START if LORE_DAILY_CEILING_USD is still set anywhere,
      # rather than ignoring it: believing a number caps the day when none does is worse
      # than having no answer at all.
      LORE_ALLOW_METERED: ${LORE_ALLOW_METERED:-0}
      # LORE_RUN_TESTS is gone (D-71). lore READS a test suite — whether the change
      # is covered, whether a test asserts what its name claims — and never runs one.
      # A suite that fails belongs to whoever owns the repository, and CI already
      # tells them. Running it here meant executing an arbitrary dependency tree on
      # this host to rediscover something its owner has.
      #
      # The sandbox stays: `tsc` and `eslint` resolve their binaries out of the
      # target's node_modules, so the INSTALL still runs, and an install runs
      # lifecycle scripts. That is what D-24 contains now.
      LORE_TIERS: ${LORE_TIERS:-}     # unset = the three-vendor default ladder
      LORE_WEBHOOK_URL: ${LORE_WEBHOOK_URL:-}
      LORE_HEARTBEAT_URL: ${LORE_HEARTBEAT_URL:-}
      # Where litestream writes, so the heartbeat can PAGE when the knowledge base has
      # stopped being replicated. `spec/operations.md` §2.1 has listed that under
      # "someone should look now" since it was written, and nothing ever sent it: the
      # only replica check lived in `make status`, which is a command a human runs.
      # Unset is supported and reports `replica: "unconfigured"` — the check could not
      # run, which is not the same as passing.
      LORE_BACKUP_DIR: /backup
      OPENCODE_SERVER: http://opencode:4096
      # The same credentials the opencode service is started with. opencode answers
      # a bare 401 with no hint when these are missing, which cost real time to
      # diagnose the first time.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-lore}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      # A HOST BIND, NOT A NAMED VOLUME, and the path is identical on both sides.
      #
      # The T0 sandbox asks the host daemon to bind-mount a worktree into a sibling
      # container by absolute path. The daemon resolves that path on the HOST — so
      # with a named volume it would mount an empty directory and the tests would
      # run against nothing, reporting a clean suite for code it never saw. Same
      # path everywhere is the only arrangement where "the path I have" and "the
      # path the daemon sees" are the same string.
      - ${LORE_HOST_DATA:-/var/lib/lore}:${LORE_HOST_DATA:-/var/lib/lore}
      # THE DATABASE, AND ONLY THE DATABASE — see LORE_DB_DIR above for why it cannot
      # live on the bind. Shared with litestream, which is the only other process that
      # opens it; within one Linux kernel that is a supported SQLite arrangement.
      - lore-db:/var/lib/lore/db
      # READ-ONLY, and only so the service can tell whether it is still being backed
      # up. litestream owns this directory; lore reads mtimes in it and nothing else.
      # A page about the replica has to come from something that runs unattended, and
      # this is the only mount that makes that possible.
      - ${LORE_HOST_BACKUP:-./backup}:/backup:ro
      # The T0 sandbox launches SIBLING containers for test execution, so untrusted
      # project code never runs in this container — which holds the knowledge
      # database, the attestation signing key and every provider credential (D-24).
      # No git credentials: lore fetches nothing, so there is no key here to lose.
      # A host process refreshes the mirrors this reads (D-65).
      #
      # This grants root-equivalent control of the host daemon. Acceptable only
      # because this box does one job on a private tailnet; it is the single
      # largest privilege in this file and should be revisited if that changes.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is the T0 sandbox's only route to the host daemon (D-24), and it
    # is mode 0660. lore runs as LORE_UID, not root, so it needs the socket's GROUP.
    #
    # 0 suits Docker Desktop, where the socket is root:root. On a Linux host — the
    # Orange Pi included — it is the `docker` group's gid instead:
    #   LORE_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
    # Getting it wrong is not silent: every T0 test run reports "permission denied
    # while trying to connect to the Docker daemon socket", which is how this was
    # found.
    group_add:
      - "${LORE_DOCKER_GID:-0}"
    depends_on:
      - opencode

  # Model transport. Reviewers inherit this configuration, which is how they get
  # the same MCP servers and plugins a Claude Code session has (D-12).
  opencode:
    build:
      context: ..
      dockerfile: deploy/opencode.Dockerfile
      args:
        # Must match LORE_UID: opencode rewrites auth.json when it renews the OAuth
        # token, and the staged file is owned by the host user who ran make sync.
        LORE_UID: "${LORE_UID:-1000}"
    platform: linux/arm64
    restart: unless-stopped
    environment:
      # Verified: opencode reads this from the environment, with no auth.json. The
      # staged auth.json below also carries it; either alone is enough.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Z.AI Coding Plan. opencode reads this straight from the environment, so a
      # headless host needs no interactive login.
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      # THE SECOND Z.AI PLAN, reached as the custom provider `zai-coding-plan2` in
      # opencode.json. A subscription that is out of quota is out for every tier at once,
      # so a second one is the only spare capacity that survives the first running dry —
      # and opencode's `auth login` cannot reach a custom provider id at all, because its
      # picker lists the built-in catalogue and nothing else. The key comes in by name,
      # exactly as the first one does, so the config file stays safe to copy.
      ZAI2_API_KEY: ${ZAI2_API_KEY:-}
      # The plane MCP config references these by name rather than embedding the
      # key, so the config file is safe to copy and the secret stays in .env.
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE_SLUG: ${PLANE_WORKSPACE_SLUG:-}
      # Basic auth on the server. lore reads the same two variables, which is how a
      # protected server needs no extra configuration on either side.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-lore}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    volumes:
      # THE REPOSITORIES ONLY, READ-ONLY, AT THE SAME PATH AS IN `lore`.
      #
      # Three things depend on this and all are easy to get wrong:
      #
      # 1. lore hands opencode an ABSOLUTE worktree path. Without this mount the
      #    directory simply does not exist over here and every review fails; with a
      #    different mount point it silently reviews nothing.
      #
      # 2. `:ro` enforces INV-9 at the filesystem. Reviewers are denied write tools
      #    in the request body already, but that is a policy the model could in
      #    principle route around. A read-only bind is not a policy.
      #
      # 3. `/repos`, NOT the whole data directory — and this was wrong until
      #    2026-08-05, when it was checked rather than assumed.
      #
      #    This container runs third-party models with file-reading tools, and it runs
      #    as the SAME uid as `lore` (it has to: it writes its own session state).
      #    Mounting the data root therefore handed a reviewer:
      #
      #      * `attest_ed25519.pem`, the attestation SIGNING KEY — the one secret that
      #        makes an attestation mean anything. Verified readable from inside this
      #        container, mode 0600 notwithstanding, because same uid.
      #      * `lore.db`, every repository's knowledge, findings and token hashes,
      #        world-readable at 0644.
      #      * `keys/`, where a leftover deploy key was still sitting.
      #
      #    None of it is needed to read a worktree. The reviewer gets the repositories
      #    and nothing else.
      - ${LORE_HOST_DATA:-/var/lib/lore}/repos:${LORE_HOST_DATA:-/var/lib/lore}/repos:ro
      # This machine's opencode configuration, staged by `make sync-opencode`:
      # the plane MCP server, the plugins and the read-only agent, so reviewers
      # inherit what a Claude Code session has (D-12).
      #
      # The staging step STRIPS THE ANTHROPIC CREDENTIAL. Claude writes the code
      # under review, so with no Anthropic credential present, D-1 is enforced by
      # absence rather than by a tier config a typo could undo.
      # WRITABLE, deliberately. opencode installs declared plugins into this
      # directory at startup, so a read-only mount makes every request 500 with
      # "Unexpected server error" and nothing in the log.
      #
      # This was masked until the permissions were fixed: while the directory was
      # unreadable opencode silently ran with defaults and no plugins. Fixing one
      # bug exposed the next, which is the honest shape of this kind of work.
      #
      # It is not the credential — auth.json is mounted separately and read-only.
      - ./opencode/config:/home/lore/.config/opencode
      # opencode needs a WRITABLE data directory — it stores session state there.
      # The volume provides that scratch space; auth.json is bound over it so the
      # staged credentials land at the path opencode reads. Docker applies the
      # deeper path last, so the file mount wins.
      #
      # WRITABLE, and it was `:ro` until the OpenAI credential arrived.
      #
      # An API key is a constant, so read-only cost nothing and bought a little. An
      # OAUTH credential is not: it carries `expires` and `refresh`, and opencode
      # must write the renewed token back roughly hourly. Read-only would have let
      # reviews work for about an hour and then fail in a way that looks like an
      # expired subscription rather than a mount flag.
      #
      # That is the third read-only-mount failure in this deployment — 0700 staged
      # directories, then plugins that could not install, now this. The pattern is
      # worth naming: `:ro` is a claim that nothing on the other side ever needs to
      # write, and that claim keeps turning out to be false.
      - opencode-data:/home/lore/.local/share/opencode
      - ./opencode/data/auth.json:/home/lore/.local/share/opencode/auth.json

  # Continuous replication of the SQLite database.
  #
  # The knowledge base IS the product: losing it loses everything the workgroup
  # ever taught the service, and this device has no redundancy. The target must be
  # OFF this machine, and the restore must actually have been performed — an
  # untested backup is not a backup.
  # Off by default until a replica target is configured: with empty credentials it
  # would restart-loop forever, and a service permanently failing in the background
  # is how people learn to ignore the logs.
  #
  #   make backup-on     enable, once LITESTREAM_* are set in .env
  # ALWAYS ON, and not behind a profile.
  #
  # It was opt-in because it needed S3 credentials, and an opt-in backup is one that
  # is off. The replica is a local folder now, so there is nothing to configure and
  # no reason to gate it: the knowledge base is the product, and it is the one thing
  # here with no other copy.
  litestream:
    image: litestream/litestream:latest
    environment:
      # litestream.yml reads the database path from here. It is the VOLUME, not the
      # host bind: replicating a file over virtiofs from a second container is half of
      # the corruption this split exists to end.
      LORE_DB_DIR: /var/lib/lore/db
    platform: linux/arm64
    restart: unless-stopped
    command: ["replicate"]
    volumes:
      # The database, in the volume it shares with lore. No host bind here at all: the
      # only reason this container existed on one was the database, and that has moved.
      - lore-db:/var/lib/lore/db
      # The handoff, and the one thing that STAYS on the host. An outer script takes
      # files out of THIS directory and off the machine; nothing in lore knows how, and
      # that is the whole point of the split. It is also why moving the database inside
      # costs nothing operationally — what a person carries away was never the database.
      - ${LORE_HOST_BACKUP:-./backup}:/backup
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - lore

volumes:
  opencode-data:
  # ext4 inside the Linux VM, which is the entire point — see LORE_DB_DIR. NOT backed up
  # by being a volume; litestream replicates it to the host bind above, as it always did.
  lore-db:
